name: Package Vectob IMG for iPhone
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare compression tools
        run: |
          command -v zstd || (sudo apt-get update -qq && sudo apt-get install -y zstd)
          command -v zip || (sudo apt-get update -qq && sudo apt-get install -y zip)

      - name: Download built Vectob disk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          gh release download v0.1.1-alpha --repo "$GITHUB_REPOSITORY" --pattern 'vectob-0.1.1-i386.img.zst' --dir output

      - name: Repackage disk into ZIP supported by iPhone Files
        run: |
          zstd -d -f output/vectob-0.1.1-i386.img.zst -o output/vectob-0.1.1-i386.img
          cd output
          zip -1 -q Vectob-OS-0.1.1-i386.zip vectob-0.1.1-i386.img
          unzip -tq Vectob-OS-0.1.1-i386.zip
          ls -lh Vectob-OS-0.1.1-i386.zip

      - name: Attach ZIP to Vectob release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.1-alpha output/Vectob-OS-0.1.1-i386.zip --repo "$GITHUB_REPOSITORY" --clobber
