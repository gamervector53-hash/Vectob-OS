name: Vectob OS 0.2 UEFI ISO
on:
  workflow_dispatch:
  push:
    branches: [vectob-0.2-uefi]
    paths:
      - '.github/workflows/vectob-uefi.yml'
      - 'vectob-0.2/**'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO tools
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools grub-efi-amd64-bin grub-pc-bin mtools dosfstools
      - name: Build minimal Debian XFCE live filesystem
        run: |
          sudo apt-get install -y debootstrap
          sudo mkdir -p rootfs
          sudo debootstrap --arch=amd64 --variant=minbase bookworm rootfs http://deb.debian.org/debian
          sudo mount --bind /dev rootfs/dev
          sudo mount -t proc proc rootfs/proc
          sudo mount -t sysfs sysfs rootfs/sys
          sudo chroot rootfs /bin/bash -ec 'echo "deb http://deb.debian.org/debian bookworm main contrib non-free-firmware" > /etc/apt/sources.list; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends linux-image-amd64 live-boot systemd-sysv xfce4-session xfce4-panel xfdesktop4 xfwm4 thunar lightdm xserver-xorg-core xserver-xorg-input-libinput xserver-xorg-video-all dbus-x11 network-manager sudo ca-certificates; useradd -m -s /bin/bash vector; echo "vector:vector" | chpasswd; usermod -aG sudo vector; echo vectob > /etc/hostname; apt-get clean'
          sudo umount -lf rootfs/sys rootfs/proc rootfs/dev
          mkdir -p iso/live iso/boot/grub
          sudo cp rootfs/boot/vmlinuz-* iso/live/vmlinuz
          sudo cp rootfs/boot/initrd.img-* iso/live/initrd.img
          sudo mksquashfs rootfs iso/live/filesystem.squashfs -e boot -comp xz -noappend
          printf 'set timeout=5\nmenuentry "Vectob OS 0.2 Live" {\n linux /live/vmlinuz boot=live components quiet\n initrd /live/initrd.img\n}\n' > iso/boot/grub/grub.cfg
          grub-mkrescue -o Vectob-OS-0.2-amd64.iso iso
          ls -lh Vectob-OS-0.2-amd64.iso
      - uses: actions/upload-artifact@v4
        with:
          name: vectob-0.2-amd64-unsigned-iso
          path: Vectob-OS-0.2-amd64.iso
          retention-days: 7
